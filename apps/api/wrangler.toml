name = "momentum-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "momentum-local"
database_id = "d0f3ad0d-714d-4c96-b8c2-757cc2cc008d"
migrations_dir = "../../packages/db/migrations"
migrations_table = "_drizzle_migrations"

# ============================================================
# LOCAL DEFAULT VARIABLES
# ============================================================

[vars]
APP_ENV = "local"
BETTER_AUTH_URL = "http://localhost:8787"
FROM_EMAIL = "Momentum <noreply@momentum.local>"
WEB_DEV_ORIGINS = "https://work-1-csgfigyebrwxckrp.prod-runtime.all-hands.dev,https://work-2-csgfigyebrwxckrp.prod-runtime.all-hands.dev,http://localhost:12000,http://127.0.0.1:12000"

# ============================================================
# OBSERVABILITY
# ============================================================

[observability]
enabled = true
head_sampling_rate = 1

# ============================================================
# PRODUCTION
# ============================================================

[env.production]
name = "momentum-api"

[env.production.vars]
APP_ENV = "production"
BETTER_AUTH_URL = "https://momentum-by-abdullah-hassan.vercel.app"
FROM_EMAIL = "Momentum <noreply@momentum.app>"
# Comma-separated list of frontend origins allowed to call the API in
# production. Set this to your deployed web origin(s). Used by better-auth
# trustedOrigins, CORS, CSRF, and the CSP connect-src list. Override per
# deployment with `wrangler secret put WEB_ORIGINS` if origins differ.
WEB_ORIGINS = "https://momentum-by-abdullah-hassan.vercel.app"

[[env.production.d1_databases]]
binding = "DB"
database_name = "momentum-prod"
database_id = "1ac79b39-5f87-4c07-a033-33315bbd22e0"
migrations_dir = "../../packages/db/migrations"
migrations_table = "_drizzle_migrations"

# ============================================================
# LOCAL
# ============================================================

[env.local]
name = "momentum-api-local"

[env.local.vars]
APP_ENV = "local"
BETTER_AUTH_URL = "http://localhost:8787"
FROM_EMAIL = "Momentum <noreply@momentum.local>"
WEB_DEV_ORIGINS = "https://work-1-csgfigyebrwxckrp.prod-runtime.all-hands.dev,https://work-2-csgfigyebrwxckrp.prod-runtime.all-hands.dev,http://localhost:12000,http://127.0.0.1:12000"

[[env.local.d1_databases]]
binding = "DB"
database_name = "momentum-local"
database_id = "d0f3ad0d-714d-4c96-b8c2-757cc2cc008d"
migrations_dir = "../../packages/db/migrations"
migrations_table = "_drizzle_migrations"